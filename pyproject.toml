[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetforge"
version = "1.0.0"
description = "Clean, summarize and merge messy spreadsheets (CSV/Excel/JSON)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SheetForge contributors" }]
keywords = ["spreadsheet", "csv", "excel", "data-cleaning", "automation"]
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sheetforge = "sheetforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
